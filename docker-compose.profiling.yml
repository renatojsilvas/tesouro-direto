services:
  app:
    # 74.3: convertido de `cpus`/`mem_limit` (legado) para
    # `deploy.resources.limits` (forma canônica do Compose Spec) NO MESMO
    # commit em que docker-compose.yml ganhou `deploy.resources.limits`
    # para `app` — o Compose v2 REJEITA o projeto inteiro quando as duas
    # formas coexistem para o mesmo serviço com valores distintos
    # ("can't set distinct values on 'cpus' and
    # 'deploy.resources.limits.cpus': invalid compose project"). As
    # variáveis `PROFILE_CPUS`/`PROFILE_MEM` são preservadas com os mesmos
    # defaults (`1`/`1g`) — o profiling continua podendo soltar o `app`
    # além do orçamento de produção (0,70 vCPU/256M) para reproduzir a CPU
    # real da VPS sob controle do operador.
    deploy:
      resources:
        limits:
          cpus: "${PROFILE_CPUS:-1}"
          memory: "${PROFILE_MEM:-1g}"

  # command: do serviço `db` é SUBSTITUÍDO pelo compose, não mesclado com o
  # docker-compose.yml base — por isso TODAS as flags de tuning da 74.2 são
  # repetidas aqui, e não só a de pg_stat_statements. Se o `command:` do `db`
  # no docker-compose.yml mudar, este overlay precisa acompanhar no mesmo
  # commit (armadilha registrada em docs/PLANO.md, 74.2).
  db:
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - autovacuum_work_mem=16MB
      - -c
      - temp_buffers=4MB
      - -c
      - max_connections=25
      - -c
      - jit=off
      - -c
      - autovacuum_max_workers=1
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_parallel_workers=0
      - -c
      - max_parallel_maintenance_workers=0
      - -c
      - huge_pages=off
      - -c
      - max_wal_size=256MB
      - -c
      - min_wal_size=64MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
