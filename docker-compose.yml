services:
  app:
    build: .
    container_name: tesouro-direto-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=tesouro_direto;Username=app;Password=${DB_PASSWORD:-app123}
      - ASPNETCORE_ENVIRONMENT=Production
      # 77.2: alvo passa a ser o Alloy (loki.source.api na porta 3100), não mais o
      # container `loki` — nada muda no protocolo, o sink Serilog não sabe a diferença.
      - Loki__Uri=http://alloy:3100
      - ApiKey__Key=${API_KEY:?API_KEY é obrigatório no .env}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?ADMIN_EMAIL é obrigatório no .env}
    depends_on:
      db:
        condition: service_healthy
    # 74.4a: dimensionado para o cenario COM os limites de CPU da 74.3
    # (app -> 0,18 vCPU), nao para o startup de hoje sem limite (~9s local,
    # ~1min no deploy real com PublishReadyToRun). start_period 90s e
    # interval 30s dao folga para JIT residual + espera do `db` healthy sob
    # quota de CPU pequena; interval curto faria o proprio `curl` de
    # healthcheck competir por quota com o processo que ele mede.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    # 74.3 — DESVIO APROVADO PELO DONO: a 74.1 mediu pico de CPU sob carga
    # de 55,0% (footprint.md §3.2) contra a provisao original de 0,18 vCPU
    # (18%) da 74.0/74.2 — CPU nao se estoca, entao teto rigido (`cpus`)
    # desperdicaria ciclo ocioso que o vizinho poderia usar; peso
    # (`cpu_shares`) e a forma certa, com um teto FOLGADO so para conter
    # loop desgovernado, nao para racionar. Memoria continua com teto
    # RIGIDO (e estado, pode ser retida) via `deploy.resources.limits`,
    # forma canonica do Compose Spec. `memswap_limit` = `memory`: falha alta
    # e visivel (OOM) em vez de latencia arrastada por reclaim de swap —
    # decisao explicita, sem ela o Docker permite ate 2x de swap em
    # silencio. ACHADO EMPIRICO NAO PREVISTO NO PLANO: o teto de PIDs vai
    # em `deploy.resources.limits.pids`, NAO no campo legado `pids_limit`
    # — coexistir com `deploy.resources.limits` no mesmo serviço da o MESMO
    # erro do conflito `cpus`/`mem_limit` ("can't set distinct values on
    # 'pids_limit' and 'deploy.resources.limits.pids': invalid compose
    # project"), confirmado com `docker compose config -q` e reproduzido
    # num compose minimo. `deploy.resources.limits.pids` funciona fora de
    # swarm (confirmado no `docker inspect` real: `HostConfig.PidsLimit`
    # bate com o valor).
    cpu_shares: 1024
    memswap_limit: 256M
    deploy:
      resources:
        limits:
          cpus: "0.70"
          memory: 256M
          pids: 200

  db:
    image: postgres:16-alpine
    container_name: tesouro-direto-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tesouro_direto
      # 79-A.1: bootstrap do initdb continua `app` DE PROPÓSITO — a
      # aplicação ainda conecta com essa credencial nesta fase (linha 9,
      # não tocada). A troca do bootstrap para `postgres` entra na 79-A.2,
      # junto com a troca da connection string da aplicação para `td_app`.
      # Mesmo depois de trocar, em volume `pgdata` já inicializado a troca
      # não tem efeito nenhum — o cluster de produção segue com `app` como
      # bootstrap até a promoção manual da 79-A.3 (achado 3 do PLANO).
      POSTGRES_USER: app
      # Continua a senha da role `app` (a única que a aplicação usa nesta
      # fase). Na 79-A.2, quando o bootstrap virar `postgres`, esta
      # variável passa a valer só para a role admin.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app123}
      # 79-A.1: senha da role td_app, consumida por
      # infra/postgres/initdb/01-provision-td-app.sh (caminho de ambiente
      # NOVO). Fail-fast: sem valor no .env, o compose recusa subir.
      TD_APP_PASSWORD: ${TD_APP_PASSWORD:?TD_APP_PASSWORD é obrigatório no .env (senha da role td_app da aplicação)}
    # command: SUBSTITUÍDO, não mesclado, por qualquer overlay que também
    # defina `command:` para este serviço (docker-compose.profiling.yml
    # repete integralmente esta lista + as flags de pg_stat_statements —
    # ver 74.2 em docs/PLANO.md). Tuning agressivo de memória autorizado
    # pelo dono (74.2, ampliação de escopo): teto de perda de throughput
    # é 10% do teto medido de req/s; a conta de pior caso de memória está
    # em docs/load/footprint.md e no relatório da tarefa.
    command:
      - postgres
      # --- memória: os itens que realmente pesam ---
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - autovacuum_work_mem=16MB
      - -c
      - temp_buffers=4MB
      # max_connections=25: conferido contra o Npgsql em paralelo nesta
      # mesma tarefa — src/TesouroDireto.Infrastructure/DependencyInjection.cs
      # colapsou EF+Dapper num ÚNICO NpgsqlDataSource com
      # `NpgsqlMaxPoolSize=10` (não duas pools de 10, que era a suposição
      # inicial). Conta: 10 (nossa pool, verificada no código) + 3
      # (superuser_reserved_connections, default do Postgres, não alterado)
      # + 12 (margem para outras aplicações que passarão a compartilhar
      # esta instância) = 25.
      - -c
      - max_connections=25
      # --- CPU/memória: 1 vCPU não tem o que paralelizar ---
      - -c
      - jit=off
      - -c
      - autovacuum_max_workers=1
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_parallel_workers=0
      - -c
      - max_parallel_maintenance_workers=0
      # --- fecha o ponto cego de hugetlb no footprint por cgroup ---
      - -c
      - huge_pages=off
      # --- WAL/checkpoint: reduz burst de I/O num vCPU só, não é memória ---
      - -c
      - max_wal_size=256MB
      - -c
      - min_wal_size=64MB
      # --- planner: VPS é SSD; evita plano ruim sob work_mem mais baixo ---
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 79-A.1: hook de provisionamento da role td_app (ambiente NOVO) + o
      # SQL canônico que ele invoca, montado num caminho separado de
      # propósito — ver infra/postgres/initdb/01-provision-td-app.sh.
      # Bind-mount: exige `--force-recreate` no deploy para o container
      # enxergar mudança (regra registrada do projeto).
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/sql:/opt/td/sql:ro
    # 74.4a: interval 5s->15s pelo mesmo motivo do `app` (74.3 traz
    # `db` -> 0,10 vCPU; `pg_isready` a cada 5s tambem come quota de um
    # processo que ja e pequeno). `pg_isready` e barato e nao espera
    # nenhum outro serviço, entao start_period fica como esta.
    # 79-A.1: continua `-U app` (acompanha o bootstrap acima, que não muda
    # nesta fase). `pg_isready` não autentica de fato — PQping devolve OK
    # mesmo com falha de auth — então este healthcheck nunca dependeu do
    # REVOKE nem da existência da role td_app, só de o servidor aceitar
    # conexões.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tesouro_direto"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    # 74.3 — mesma decisao do `app` (ver comentario la): peso de CPU, nao
    # teto rigido — pico medido de 61,5% (footprint.md §3.2) contra a
    # provisao original de 0,10 vCPU. Memoria segue com teto rigido:
    # OOM-kill do `db` e pior que o de qualquer outro container (o
    # postmaster trata como crash e reinicia o cluster inteiro — ver Risco
    # da 74 no PLANO.md), por isso `memswap_limit` = `memory` tambem aqui:
    # falha alta e visivel em vez de latencia arrastada.
    cpu_shares: 1024
    memswap_limit: 128M
    deploy:
      resources:
        limits:
          cpus: "0.60"
          memory: 128M
          pids: 128

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: tesouro-direto-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5275:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8081
      - ApiSettings__BaseUrl=http://app:8080
      - ApiSettings__ApiKey=${API_KEY:?API_KEY é obrigatório no .env}
      - Google__ClientId=${GOOGLE_CLIENT_ID:-}
      - Google__ClientSecret=${GOOGLE_CLIENT_SECRET:-}
      # 77.2: alvo passa a ser o Alloy (loki.source.api na porta 3100), não mais o
      # container `loki` — nada muda no protocolo, o sink Serilog não sabe a diferença.
      - Loki__Uri=http://alloy:3100
    depends_on:
      app:
        condition: service_healthy
    # 74.4a: `web` ganha healthcheck (nao tinha nenhum). ARMADILHA: a
    # imagem mcr.microsoft.com/dotnet/aspnet:8.0 NAO tem curl instalado
    # (diferente do Dockerfile da API, que instala curl explicitamente) e
    # o `web` nao expoe nenhum endpoint HTTP de health (verificado em
    # src/TesouroDireto.Web/Program.cs). Duas saidas possiveis: instalar
    # curl no Dockerfile.web (engorda a imagem) ou checar a porta via
    # bash+/dev/tcp. Escolhido /dev/tcp: e o padrao ja usado neste projeto
    # para o mesmo par de imagens (docker-compose.e2e.yml, ver tambem a
    # memoria feedback_docker_aspnet_no_curl), custo zero de imagem, e
    # suficiente para provar que o Kestrel esta escutando. Tempos
    # dimensionados como o `app`: a 74.3 leva `web` a 0,07 vCPU, MENOS que
    # o `app` (0,18), e nao ha medição de startup do `web` sob CPU
    # reduzida — usar o mesmo orcamento conservador do `app` em vez de um
    # menor por falta de dado.
    healthcheck:
      test: ["CMD", "bash", "-c", "timeout 2 bash -c 'echo > /dev/tcp/localhost/8081' 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    # 74.3 — mesma decisao do `app`: peso de CPU (pico medido 22,1%,
    # footprint.md §3.3, contra provisao original de 0,07 vCPU), teto de
    # memoria rigido. `memswap_limit` NAO fixado explicitamente aqui — só
    # `app`/`db` (falha visível) e `grafana`/`loki` (permitido; ambos
    # removidos na 77.4) tiveram decisão explícita no desvio aprovado;
    # para `web` fica o default do Docker, verificado no `docker inspect`
    # da entrega.
    cpu_shares: 512
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 160M
          pids: 128

  # Observabilidade
  prometheus:
    # 77.4 — sobe SÓ sob `--profile load`: o k6 faz remote-write para este
    # Prometheus local (docker-compose.load.yml), e mandar as séries `k6_*`
    # para a nuvem estouraria o teto de séries do plano justamente durante o
    # teste de carga. Sem este serviço no base, o overlay `docker-compose.
    # load.yml` define um `prometheus` sem `image` e o gate `docker compose
    # config -q` do CI quebra ("service must define image or build").
    profiles: ["load"]
    image: prom/prometheus:v3.10.0
    container_name: tesouro-direto-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      # 74.2: footprint.md §5 mostra que o limite calculado de 114 MB é
      # inflado pelo piso de +64 MB da regra de folga (pico real 50,2 MB;
      # só ×1,3 daria 65,3 MB) — uso 80% do valor SEM o piso (65,3×0,8≈52),
      # com uma margem pequena para o self-scrape novo (~4 MB).
      # 74.3: o teto RIGIDO desta fase (72M) ficou acima dos 56MiB
      # calculados na 74.2 — mantido em ~80% do teto, senão o
      # GOMEMLIMIT nunca dispararia antes do OOM killer do cgroup.
      - GOMEMLIMIT=57MiB
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.external-url=/prometheus/'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=256MB'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    # 74.3 — DESVIO APROVADO PELO DONO: peso de CPU, teto de memória
    # rígido. `memswap_limit` NÃO fixado explicitamente — só `app`/`db`
    # (falha visível) e `grafana`/`loki` (permitido; ambos removidos na
    # 77.4) tiveram decisão explícita no desvio aprovado; para
    # `prometheus` fica o default do Docker, verificado no `docker
    # inspect` da entrega.
    cpu_shares: 64
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 72M
          pids: 64

  # Coletor único de observabilidade: reúne, num container só, o que até a
  # 77.3 eram 5 serviços (`grafana`, `loki`, `prometheus`, `promtail`,
  # `node-exporter` — 516 MB de teto somado) — scrape de métricas do app e
  # do host, tail dos 4 fluxos de log (nginx, kernel, API, Web, com hash de
  # IP) e remote_write/loki.write para o Grafana Cloud; alerting e
  # dashboards vivem na nuvem (infra/grafana/cloud/, 77.3). Nasceu como
  # PORTÃO de medição na 77.0 (subiu AO LADO da stack antiga, sem teto de
  # memória, para medir o pico real da não-descartável antes de remover
  # qualquer coisa) — o portão FECHOU em 15/08/2026 com 51,99 MB medidos
  # pela métrica canônica td_container_memory_unreclaimable_bytes contra o
  # limiar de 200 MB (ver docs/PLANO.md, Fase 77). A 77.4 removeu a stack
  # antiga que ficava ao lado.
  alloy:
    image: grafana/alloy:v1.18.1
    container_name: tesouro-direto-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      - GC_PROM_URL=${GC_PROM_URL:?defina GC_PROM_URL no .env}
      - GC_PROM_USER=${GC_PROM_USER:?defina GC_PROM_USER no .env}
      - GC_TOKEN=${GC_TOKEN:?defina GC_TOKEN no .env}
      # 77.2 — os 4 fluxos de log (nginx, kernel, API, Web) todos passam pelo mesmo
      # loki.write "cloud" do config.alloy.
      - GC_LOKI_URL=${GC_LOKI_URL:?defina GC_LOKI_URL no .env}
      - GC_LOKI_USER=${GC_LOKI_USER:?defina GC_LOKI_USER no .env}
      - GC_IP_SALT=${GC_IP_SALT:?defina GC_IP_SALT no .env}
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # 77.1 — os mesmos binds read-only que o serviço `node-exporter`
      # (removido na 77.4) usava, agora lidos pelo prometheus.exporter.unix
      # do config.alloy.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/node_exporter/textfile:/host/textfile:ro
      # 77.2 — mesmos binds read-only que o serviço `promtail` (removido na
      # 77.4) tinha.
      - /var/log/nginx:/var/log/nginx:ro
      # DIRETÓRIO, não `/var/log/kern.log:/var/log/host/kern.log:ro`: bind de arquivo
      # fixa o inode e o logrotate troca o inode na rotação (rename+recria), o que faria
      # o tail parar de ver log novo em silêncio (decisão original do serviço
      # `promtail`, removido na 77.4, preservada aqui).
      - /var/log:/var/log/host:ro
    # Teto INTERINO fixado na 77.5, deliberadamente folgado (~3× o medido).
    #
    # Medido em produção com o Alloy já fazendo TODO o trabalho (métricas de host da
    # 77.1 + os 4 fluxos de log da 77.2): não-descartável de 62,34 MB, pico de 65,4 MB
    # na janela do gate. Note que isso é MAIOR que os 51,99 MB do portão da 77.0 — lá
    # o Alloy só fazia o scrape da API, então os dois números não são comparáveis; o
    # que vale é que 62 MB continua muito abaixo do limiar de decisão do portão.
    #
    # Por que 3× e não o aperto usual: o consumo do Alloy sob ingestão REJEITADA nunca
    # foi observado. Os limites do free tier do Grafana Cloud só entram em vigor em
    # 17/08/2026 (até lá a stack roda sob limites de trial: 310k séries, não 10k), e
    # quando a nuvem começar a rejeitar, o remote_write bufferiza e retenta — é
    # exatamente aí que a memória pode subir. Um teto apertado transformaria rejeição
    # de ingestão em OOM do coletor, que é a falha pior: perderíamos a observabilidade
    # justamente no momento em que ela avisaria do problema.
    #
    # A regra `td-cloud-overage` (77.5) alerta sobre esse cenário, e as regras
    # `td-container-*` alertam se a não-descartável passar de 85%/95% deste teto.
    # Reavaliar após 17/08 com dado sob o regime real do free tier.
    deploy:
      resources:
        limits:
          memory: 192M

volumes:
  pgdata:
  prometheus-data:
  alloy-data:

networks:
  default:
    name: tesouro-net
