services:
  app:
    build: .
    container_name: tesouro-direto-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=tesouro_direto;Username=app;Password=${DB_PASSWORD:-app123}
      - ASPNETCORE_ENVIRONMENT=Production
      - Loki__Uri=http://loki:3100
      - ApiKey__Key=${API_KEY:?API_KEY é obrigatório no .env}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?ADMIN_EMAIL é obrigatório no .env}
    depends_on:
      db:
        condition: service_healthy
    # 74.4a: dimensionado para o cenario COM os limites de CPU da 74.3
    # (app -> 0,18 vCPU), nao para o startup de hoje sem limite (~9s local,
    # ~1min no deploy real com PublishReadyToRun). start_period 90s e
    # interval 30s dao folga para JIT residual + espera do `db` healthy sob
    # quota de CPU pequena; interval curto faria o proprio `curl` de
    # healthcheck competir por quota com o processo que ele mede.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    # 74.3 — DESVIO APROVADO PELO DONO: a 74.1 mediu pico de CPU sob carga
    # de 55,0% (footprint.md §3.2) contra a provisao original de 0,18 vCPU
    # (18%) da 74.0/74.2 — CPU nao se estoca, entao teto rigido (`cpus`)
    # desperdicaria ciclo ocioso que o vizinho poderia usar; peso
    # (`cpu_shares`) e a forma certa, com um teto FOLGADO so para conter
    # loop desgovernado, nao para racionar. Memoria continua com teto
    # RIGIDO (e estado, pode ser retida) via `deploy.resources.limits`,
    # forma canonica do Compose Spec. `memswap_limit` = `memory`: falha alta
    # e visivel (OOM) em vez de latencia arrastada por reclaim de swap —
    # decisao explicita, sem ela o Docker permite ate 2x de swap em
    # silencio. ACHADO EMPIRICO NAO PREVISTO NO PLANO: o teto de PIDs vai
    # em `deploy.resources.limits.pids`, NAO no campo legado `pids_limit`
    # — coexistir com `deploy.resources.limits` no mesmo serviço da o MESMO
    # erro do conflito `cpus`/`mem_limit` ("can't set distinct values on
    # 'pids_limit' and 'deploy.resources.limits.pids': invalid compose
    # project"), confirmado com `docker compose config -q` e reproduzido
    # num compose minimo. `deploy.resources.limits.pids` funciona fora de
    # swarm (confirmado no `docker inspect` real: `HostConfig.PidsLimit`
    # bate com o valor).
    cpu_shares: 1024
    memswap_limit: 256M
    deploy:
      resources:
        limits:
          cpus: "0.70"
          memory: 256M
          pids: 200

  db:
    image: postgres:16-alpine
    container_name: tesouro-direto-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tesouro_direto
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app123}
    # command: SUBSTITUÍDO, não mesclado, por qualquer overlay que também
    # defina `command:` para este serviço (docker-compose.profiling.yml
    # repete integralmente esta lista + as flags de pg_stat_statements —
    # ver 74.2 em docs/PLANO.md). Tuning agressivo de memória autorizado
    # pelo dono (74.2, ampliação de escopo): teto de perda de throughput
    # é 10% do teto medido de req/s; a conta de pior caso de memória está
    # em docs/load/footprint.md e no relatório da tarefa.
    command:
      - postgres
      # --- memória: os itens que realmente pesam ---
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - autovacuum_work_mem=16MB
      - -c
      - temp_buffers=4MB
      # max_connections=25: conferido contra o Npgsql em paralelo nesta
      # mesma tarefa — src/TesouroDireto.Infrastructure/DependencyInjection.cs
      # colapsou EF+Dapper num ÚNICO NpgsqlDataSource com
      # `NpgsqlMaxPoolSize=10` (não duas pools de 10, que era a suposição
      # inicial). Conta: 10 (nossa pool, verificada no código) + 3
      # (superuser_reserved_connections, default do Postgres, não alterado)
      # + 12 (margem para outras aplicações que passarão a compartilhar
      # esta instância) = 25.
      - -c
      - max_connections=25
      # --- CPU/memória: 1 vCPU não tem o que paralelizar ---
      - -c
      - jit=off
      - -c
      - autovacuum_max_workers=1
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_parallel_workers=0
      - -c
      - max_parallel_maintenance_workers=0
      # --- fecha o ponto cego de hugetlb no footprint por cgroup ---
      - -c
      - huge_pages=off
      # --- WAL/checkpoint: reduz burst de I/O num vCPU só, não é memória ---
      - -c
      - max_wal_size=256MB
      - -c
      - min_wal_size=64MB
      # --- planner: VPS é SSD; evita plano ruim sob work_mem mais baixo ---
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 74.4a: interval 5s->15s pelo mesmo motivo do `app` (74.3 traz
    # `db` -> 0,10 vCPU; `pg_isready` a cada 5s tambem come quota de um
    # processo que ja e pequeno). `pg_isready` e barato e nao espera
    # nenhum outro serviço, entao start_period fica como esta.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tesouro_direto"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    # 74.3 — mesma decisao do `app` (ver comentario la): peso de CPU, nao
    # teto rigido — pico medido de 61,5% (footprint.md §3.2) contra a
    # provisao original de 0,10 vCPU. Memoria segue com teto rigido:
    # OOM-kill do `db` e pior que o de qualquer outro container (o
    # postmaster trata como crash e reinicia o cluster inteiro — ver Risco
    # da 74 no PLANO.md), por isso `memswap_limit` = `memory` tambem aqui:
    # falha alta e visivel em vez de latencia arrastada.
    cpu_shares: 1024
    memswap_limit: 128M
    deploy:
      resources:
        limits:
          cpus: "0.60"
          memory: 128M
          pids: 128

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: tesouro-direto-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5275:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8081
      - ApiSettings__BaseUrl=http://app:8080
      - ApiSettings__ApiKey=${API_KEY:?API_KEY é obrigatório no .env}
      - Google__ClientId=${GOOGLE_CLIENT_ID:-}
      - Google__ClientSecret=${GOOGLE_CLIENT_SECRET:-}
      - Loki__Uri=http://loki:3100
    depends_on:
      app:
        condition: service_healthy
    # 74.4a: `web` ganha healthcheck (nao tinha nenhum). ARMADILHA: a
    # imagem mcr.microsoft.com/dotnet/aspnet:8.0 NAO tem curl instalado
    # (diferente do Dockerfile da API, que instala curl explicitamente) e
    # o `web` nao expoe nenhum endpoint HTTP de health (verificado em
    # src/TesouroDireto.Web/Program.cs). Duas saidas possiveis: instalar
    # curl no Dockerfile.web (engorda a imagem) ou checar a porta via
    # bash+/dev/tcp. Escolhido /dev/tcp: e o padrao ja usado neste projeto
    # para o mesmo par de imagens (docker-compose.e2e.yml, ver tambem a
    # memoria feedback_docker_aspnet_no_curl), custo zero de imagem, e
    # suficiente para provar que o Kestrel esta escutando. Tempos
    # dimensionados como o `app`: a 74.3 leva `web` a 0,07 vCPU, MENOS que
    # o `app` (0,18), e nao ha medição de startup do `web` sob CPU
    # reduzida — usar o mesmo orcamento conservador do `app` em vez de um
    # menor por falta de dado.
    healthcheck:
      test: ["CMD", "bash", "-c", "timeout 2 bash -c 'echo > /dev/tcp/localhost/8081' 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    # 74.3 — mesma decisao do `app`: peso de CPU (pico medido 22,1%,
    # footprint.md §3.3, contra provisao original de 0,07 vCPU), teto de
    # memoria rigido. `memswap_limit` NAO fixado explicitamente aqui — só
    # `app`/`db` (falha visível) e `grafana`/`loki` (permitido) tiveram
    # decisão explícita no desvio aprovado; para `web` fica o default do
    # Docker, verificado no `docker inspect` da entrega.
    cpu_shares: 512
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 160M
          pids: 128

  # Observabilidade
  grafana:
    image: grafana/grafana:12.4.1
    container_name: tesouro-direto-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD é obrigatório no .env}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN é obrigatório no .env}
      # 74.3: GOMEMLIMIT recalculado para ~80% do teto RIGIDO de memória
      # desta fase (128M), substituindo o valor da 74.2 (167MiB), que era
      # 80% de um teto provisório maior e hoje ultrapassaria o próprio
      # limite do cgroup — sem isso o GC nunca dispararia antes do OOM
      # killer. GOGC fica no default de propósito (GOMEMLIMIT + GOGC=off é
      # espiral de GC sob 1 vCPU).
      - GOMEMLIMIT=128MiB
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    # 74.3 — DESVIO APROVADO PELO DONO: peso de CPU (`cpu_shares`), não
    # teto rígido — mesmo raciocínio do `app`/`db` (ver comentário lá).
    # Memória com teto rígido. `memswap_limit` explicitamente PERMITIDO
    # (decisão explícita, não omissão): o Grafana está entre os que mais
    # têm cache a perder acima do limite (armadilha §4 do pedido) —
    # preferir reclaim/swap a matar o processo que hospeda o alerting
    # Grafana-managed (ver Risco da 74 no PLANO.md: Grafana morto cala o
    # "app down" em silêncio).
    cpu_shares: 128
    memswap_limit: 320M
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 160M
          pids: 64

  loki:
    image: grafana/loki:3.6.7
    container_name: tesouro-direto-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    environment:
      # 74.2: alvo DELIBERADAMENTE mais agressivo que os 80% de 266 MB
      # (limite calculado em footprint.md §4). O tuning desta mesma fase
      # (ingestão limitada + retenção 7d) ataca a causa do pico sob carga
      # (rajada de log de acesso não mais absorvida sem teto), então o alvo
      # usa o pico OCIOSO (104,4 MB, footprint.md §3.1) × 1,3 + margem, não
      # o pico sob carga não-tunado. Precisa de re-medição para confirmar
      # (gate da 74.2: "re-medição mostra queda").
      # 74.3: recalculado para ~80% do teto RIGIDO desta fase (132M) — o
      # valor da 74.2 (120MiB) já era menor que o novo teto e continuava
      # válido, mas a 105MiB dá mais folga a um serviço com bastante page
      # cache (footprint.md armadilha do mem.current, ver PLANO.md).
      - GOMEMLIMIT=105MiB
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    # 74.3 — DESVIO APROVADO PELO DONO: peso de CPU, teto de memória
    # rígido. `memswap_limit` explicitamente PERMITIDO: o `loki` é o
    # container com MAIS page cache acima do limite medido (204,9 MB de
    # mem.current contra 132M de teto, ver relatório) — preferir reclaim
    # de cache/swap a matar o processo por OOM num container cuja memória
    # é majoritariamente cache descartável, não heap.
    cpu_shares: 128
    memswap_limit: 264M
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 132M
          pids: 64

  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: tesouro-direto-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      # 74.2: footprint.md §5 mostra que o limite calculado de 114 MB é
      # inflado pelo piso de +64 MB da regra de folga (pico real 50,2 MB;
      # só ×1,3 daria 65,3 MB) — uso 80% do valor SEM o piso (65,3×0,8≈52),
      # com uma margem pequena para o self-scrape novo (~4 MB).
      # 74.3: o teto RIGIDO desta fase (48M) ficou abaixo dos 56MiB
      # calculados na 74.2 — recalculado para ~80% do novo teto, senão o
      # GOMEMLIMIT nunca dispararia antes do OOM killer do cgroup.
      - GOMEMLIMIT=38MiB
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.external-url=/prometheus/'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=256MB'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    # 74.3 — DESVIO APROVADO PELO DONO: peso de CPU, teto de memória
    # rígido. `memswap_limit` NÃO fixado explicitamente — só `app`/`db`
    # (falha visível) e `grafana`/`loki` (permitido) tiveram decisão
    # explícita no desvio aprovado; para `prometheus` fica o default do
    # Docker, verificado no `docker inspect` da entrega.
    cpu_shares: 64
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 48M
          pids: 64

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: tesouro-direto-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      # 74.2: só os coletores realmente consumidos por host.json + rules.yaml
      # (re-verificado nesta fase, ver relatório) — cpu/meminfo/filesystem/
      # diskstats/netdev cobrem os painéis e o alerta de disco; loadavg/stat/
      # uname/time/os entram como baseline de saúde do próprio scrape (sem
      # painel/alerta hoje, mas de custo desprezível e usados por
      # convenção do node_exporter para diagnosticar o exporter em si).
      # Esta lista é o insumo direto da 74.2b (vira `set_collectors` do
      # `prometheus.exporter.unix` do Alloy).
      - '--collector.disable-defaults'
      - '--collector.cpu'
      - '--collector.meminfo'
      - '--collector.loadavg'
      - '--collector.filesystem'
      - '--collector.diskstats'
      - '--collector.netdev'
      # veth* de containers: verificado que este serviço NÃO usa
      # `network_mode: host` nem `pid: host` (nenhum serviço deste compose
      # usa) — /proc/net/dev é por-namespace-de-rede do processo que lê, e
      # bind-montar o /proc do host não muda o namespace de rede de quem lê
      # (`/host/proc/net/dev` é `/host/proc/self/net/dev`, "self" continua
      # sendo o node-exporter na SUA própria rede em bridge). Consequência
      # dupla, e a segunda é o achado real: (1) hoje ele NÃO enxerga os
      # veth* de outros containers no host, então a explosão de séries por
      # deploy citada não ocorre nesta configuração; (2) pelo mesmo motivo,
      # ele também NÃO enxerga a interface física real da VPS — o painel
      # "Network (bytes/s)" de host.json mede o tráfego do PRÓPRIO
      # sidecar node-exporter (~zero), não o tráfego real do host. Isto é
      # um achado pré-existente, não introduzido aqui, e não uma decisão
      # de tuning — fica registrado para o dono decidir (precisaria de
      # `network_mode: host`, troca de isolamento). O filtro abaixo é
      # defensivo (protege se essa decisão mudar) e é o insumo pedido para
      # a 74.2b (Alloy herda o mesmo risco se também ganhar host network).
      - '--collector.netdev.device-exclude=^(veth.*|docker.*|br-.*)$$'
      - '--collector.stat'
      - '--collector.uname'
      - '--collector.time'
      - '--collector.os'
      # 74.6: cAdvisor rejeitado (60-120 MB de RSS contra ~42 MB de orçamento
      # do bloco INFRA) — métricas por container vêm do textfile collector,
      # alimentado por infra/host/container-metrics.sh via systemd timer no
      # host (infra/host/td-container-metrics.{service,timer}), não por um
      # segundo container. `--collector.textfile` precisa ser habilitado
      # explicitamente porque a lista acima usa `--collector.disable-defaults`.
      - '--collector.textfile'
      - '--collector.textfile.directory=/host/textfile'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/node_exporter/textfile:/host/textfile:ro
    ports:
      - "127.0.0.1:9100:9100"
    # 74.3 — DESVIO APROVADO PELO DONO: peso de CPU, teto de memória
    # rígido. Sem GOMEMLIMIT porque o node-exporter nunca teve um (pico
    # medido 8,4-10,1 MB, bem abaixo do teto — não há GC Go a governar
    # aqui na prática). `memswap_limit` NÃO fixado explicitamente — mesmo
    # raciocínio do `prometheus`.
    cpu_shares: 64
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 16M
          pids: 64

  promtail:
    image: grafana/promtail:3.6.8
    container_name: tesouro-direto-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    environment:
      # 74.2: mesmo raciocínio do prometheus (footprint.md §5) — limite
      # calculado (102 MB) é inflado pelo piso de +64 MB (pico real 37,5 MB;
      # só ×1,3 daria 48,8 MB); uso 80% do valor sem o piso.
      # 74.3: o teto RIGIDO desta fase (36M) ficou abaixo dos 40MiB
      # calculados na 74.2 — recalculado para ~80% do novo teto.
      - GOMEMLIMIT=28MiB
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log/nginx:/var/log/nginx:ro
      # 74.6: DIRETÓRIO, não `/var/log/kern.log:/var/log/host/kern.log:ro`.
      # Bind-mount de arquivo fixa o inode; o logrotate troca o inode na
      # rotação (rename+recria) e o promtail continuaria seguindo para
      # sempre o arquivo ROTACIONADO, parando de ver log novo em silêncio.
      # Montando o diretório, o path `/var/log/host/kern.log` sempre resolve
      # para o inode atual. `infra/promtail/promtail-config.yml` aponta o
      # scrape para `/var/log/host/kern.log` (editado em paralelo).
      - /var/log:/var/log/host:ro
      - promtail-positions:/tmp
    depends_on:
      - loki
    # 74.3 — DESVIO APROVADO PELO DONO: peso de CPU, teto de memória
    # rígido. `memswap_limit` NÃO fixado explicitamente — o desvio só
    # decidiu isso caso a caso para `app`/`db`/`grafana`/`loki`; o
    # `promtail` tem cache acima do teto tanto quanto o `loki` (77,5 MB
    # medidos contra 36M de teto — ver relatório), mas o dono não incluiu
    # este serviço na lista de swap permitido, então fica o default do
    # Docker, verificado no `docker inspect` da entrega e reportado se a
    # pressão de reclaim se mostrar um problema real.
    cpu_shares: 128
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 36M
          pids: 64

volumes:
  pgdata:
  grafana-data:
  loki-data:
  prometheus-data:
  promtail-positions:

networks:
  default:
    name: tesouro-net
