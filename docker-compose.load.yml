services:
  prometheus:
    # MESMA armadilha do `command:` do `db` (ver docker-compose.yml): o
    # comando é SUBSTITUÍDO pelo overlay, não mesclado. Este bloco existe só
    # para acrescentar o remote-write receiver, mas ao redefinir `command:`
    # ele apaga silenciosamente as flags do arquivo base — inclusive as de
    # retenção da 74.2. Sem repeti-las aqui, o teste de carga rodaria com
    # retenção default (15d, sem teto de tamanho) justamente na janela que
    # mais gera série e dado. Se o `command:` do prometheus mudar no
    # docker-compose.yml, este precisa acompanhar no mesmo commit.
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.external-url=/prometheus/'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=256MB'
      - '--web.enable-remote-write-receiver'

  k6:
    # Pinado (v2.1.0, commit 83a87a41e2): a fase 74.5 compara a capacidade medida
    # sob os novos limites com o baseline da tarefa 58 — versão do k6 à deriva invalida a comparação.
    image: grafana/k6:2.1.0
    profiles:
      - load
    volumes:
      - ./tests/load:/scripts:ro
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: ${K6_PROMETHEUS_RW_SERVER_URL:?defina K6_PROMETHEUS_RW_SERVER_URL, ex. http://tesouro-direto-prometheus:9090/prometheus/api/v1/write}
