# 74.4a: healthchecks deste arquivo NAO foram alterados. Decisao explicita,
# nao omissao. Este compose e standalone (nao herda deploy.resources.limits
# de docker-compose.yml) e o E2E nao roda com limite de CPU nenhum -- esticar
# start_period/interval para os mesmos valores do compose de producao so
# deixaria o CI mais lento, sem nenhum ganho de robustez (nada aqui compete
# por quota de CPU). Os valores atuais (start_period 10-15s, interval 3-5s)
# ja usam o mesmo padrao bash+/dev/tcp para app/web por falta de curl na
# imagem aspnet:8.0, adotado aqui antes desta fase.
#
# 74.3: `deploy.resources.limits` (cpus/memory/pids) + `cpu_shares` +
# `memswap_limit` aplicados aqui TAMBÉM (item 7 do aceite da tarefa 74: E2E
# precisa passar sob os mesmos limites de produção, não só o compose de
# produção). Mesmos valores de `docker-compose.yml` para `db`/`app`/`web`
# — este arquivo é standalone e não herda nada do compose base, então os
# valores são repetidos, não referenciados. `pids_limit` (legado) NÃO é
# usado de propósito: conflita com `deploy.resources.limits` presente no
# mesmo serviço (achado empírico desta fase) — o teto de PIDs vai em
# `deploy.resources.limits.pids`.
services:
  db:
    image: postgres:16-alpine
    container_name: tesouro-direto-e2e-db
    environment:
      POSTGRES_DB: tesouro_direto_e2e
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app123
    ports:
      - "5433:5432"
    volumes:
      - ./tests/TesouroDireto.E2E.Tests/seed.sql:/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tesouro_direto_e2e"]
      interval: 3s
      timeout: 3s
      retries: 10
    cpu_shares: 1024
    memswap_limit: 128M
    deploy:
      resources:
        limits:
          cpus: "0.60"
          memory: 128M
          pids: 128

  app:
    build: .
    container_name: tesouro-direto-e2e-app
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=tesouro_direto_e2e;Username=app;Password=app123
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "timeout 2 bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    cpu_shares: 1024
    memswap_limit: 256M
    deploy:
      resources:
        limits:
          cpus: "0.70"
          memory: 256M
          pids: 200

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: tesouro-direto-e2e-web
    ports:
      - "5275:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8081
      - ApiSettings__BaseUrl=http://app:8080
      - ApiSettings__ApiKey=CHANGE-ME-IN-PRODUCTION
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "timeout 2 bash -c 'echo > /dev/tcp/localhost/8081' 2>/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    cpu_shares: 512
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 160M
          pids: 128
