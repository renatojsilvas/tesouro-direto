name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tesouro_direto_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app123
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./test-results/coverage -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
      # Fails the job if line coverage drops below the threshold. Covers the
      # assemblies dotnet test instruments (API/Application/Domain/Infrastructure/Web);
      # TesouroDireto.Web entered the gate in task 32 via TesouroDireto.Web.Tests
      # (bUnit + xUnit). Gate held at a round 80% floor by choice — deliberately a
      # little below the measured merged coverage (~82.7%) to leave headroom.
      - name: Coverage gate (line >= 80%)
        run: python3 scripts/coverage-gate.py ./test-results/coverage --threshold 80 --verbose
      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      # Gate barato (segundos): a partir da fase 74.3, docker-compose.yml ganha
      # deploy.resources.limits e o Compose v2 REJEITA o projeto inteiro se as
      # chaves legadas cpus/mem_limit de um overlay coexistirem com as canonicas
      # com valores distintos ("can't set distinct values on 'cpus' and
      # 'deploy.resources.limits.cpus': invalid compose project"). Valida as
      # tres combinacoes antes que isso vire deploy quebrado pela metade.
      # Valores dummy abaixo sao so para satisfazer os ${VAR:?...} obrigatorios
      # dos composes na validacao sintatica; nao usar secrets aqui (quebraria
      # o gate em PR de fork).
      - name: Compose config gate (sintaxe + limits legados x deploy.resources)
        env:
          API_KEY: dummy
          ADMIN_EMAIL: dummy@example.com
          K6_PROMETHEUS_RW_SERVER_URL: http://dummy:9090/prometheus/api/v1/write
          # 77.0: docker-compose.yml ganhou o serviço `alloy` com ${GC_*:?} obrigatórios;
          # sem estas dummies as 3 validações abaixo falham a partir desta fase.
          GC_PROM_URL: http://dummy
          GC_PROM_USER: "1"
          GC_TOKEN: dummy
          # 77.2: mesmo motivo, para os 3 fluxos de log novos do serviço `alloy`.
          GC_LOKI_URL: http://dummy
          GC_LOKI_USER: "1"
          GC_IP_SALT: dummy
        run: |
          set -e
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.profiling.yml config -q
          # --profile load: sem isso o Compose OMITE o servico k6 (profiles: [load])
          # da validacao, e o k6 e justamente o que esse overlay acrescenta.
          docker compose -f docker-compose.yml -f docker-compose.load.yml --profile load config -q

          # Furo que isto fecha: `config -q` valida so sintaxe/schema, nao se a tag
          # pinada EXISTE no registry. Aconteceu de verdade na 74.0: o pin
          # prom/prometheus:3.10.0 nao existe (a familia prom/* publica com prefixo
          # "v", ex. prom/prometheus:v3.10.0; grafana/* publica sem prefixo) e as tres
          # validacoes acima passavam com exit 0 mesmo assim. So um deploy real
          # revelaria "no such manifest" -- depois do nginx ja ter sido recarregado,
          # deixando o deploy pela metade. A lista de imagens vem do proprio
          # `compose config` (combinacao base+load com --profile load, a unica que
          # enxerga TODOS os servicos, incluindo o k6 que so existe atras desse
          # profile) em vez de uma lista fixa que envelhece. `docker manifest inspect`
          # consulta o registry sem baixar a imagem.
          images=$(docker compose -f docker-compose.yml -f docker-compose.load.yml --profile load config --format json \
            | jq -r '.services[] | select(.build == null) | .image' | sort -u)

          failed=0
          for image in $images; do
            # `if output=$(...)` (em vez de `output=$(...); status=$?`) e proposital:
            # com `set -e` ligado, uma atribuicao simples que falha mata o script ali
            # mesmo, antes de qualquer logica de FALHA/AVISO abaixo rodar. Dentro da
            # condicao do `if` o errexit fica suspenso so para esse comando.
            if output=$(docker manifest inspect "$image" 2>&1); then
              echo "OK    $image"
            elif echo "$output" | grep -qiE 'no such manifest|manifest unknown|not found'; then
              # Tag realmente nao existe no registry: isso e o furo que o gate cobre.
              echo "FALHA $image (tag inexistente no registry)"
              echo "$output"
              failed=1
            else
              # Erro de outra natureza (rede, timeout, rate limit do Docker Hub
              # anonimo no IP compartilhado do runner): nao reprova o job por um
              # motivo alheio a tag pinada, so avisa.
              echo "AVISO $image: falha ao consultar o manifest (ignorado, provavel rede/rate limit)"
              echo "$output"
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "Gate reprovado: pelo menos uma tag pinada nao existe no registry."
            exit 1
          fi

  e2e:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        working-directory: tests/TesouroDireto.E2E.Tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Fonte unica do fluxo E2E (subir a stack + esperar saude + seed + rodar os
      # specs): o MESMO script rodado localmente. Evita duas fontes de verdade que
      # divergem com o tempo. O script tem timeout nas esperas e um trap que derruba
      # a stack ao sair. Requer node_modules/browsers ja instalados (passo acima).
      - name: Run E2E (run-e2e.sh)
        run: ./run-e2e.sh

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/TesouroDireto.E2E.Tests/test-results/
          retention-days: 7

      # Rede de seguranca: o trap do run-e2e.sh ja faz o down -v, mas um teardown
      # explicito cobre o caso de o script falhar antes de armar o trap.
      - name: Tear down E2E environment
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  deploy:
    if: github.event_name == 'push'
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /opt/tesouro-direto
            # ANCORA: este .env e reescrito POR COMPLETO a cada deploy (nao e um merge
            # com o que ja existe na VPS). Qualquer ${VAR:?...} novo que entre no
            # docker-compose.yml (ex.: GC_* na 77.0) TEM que entrar neste printf no MESMO
            # PR -- senao a interpolacao do compose falha inteira (nenhum servico e
            # recriado, nem os que nao tem nada a ver com a variavel nova) antes mesmo do
            # `docker compose up -d` rodar. Ver scratchpad/medir-alloy.md secao 3.0/CHECKLIST.
            printf 'DB_PASSWORD=%s\nAPI_KEY=%s\nTELEGRAM_BOT_TOKEN=%s\nADMIN_EMAIL=%s\nGOOGLE_CLIENT_ID=%s\nGOOGLE_CLIENT_SECRET=%s\nGC_PROM_URL=%s\nGC_PROM_USER=%s\nGC_TOKEN=%s\nGC_LOKI_URL=%s\nGC_LOKI_USER=%s\nGC_IP_SALT=%s\n' \
              '${{ secrets.DB_PASSWORD }}' \
              '${{ secrets.API_KEY }}' \
              '${{ secrets.TELEGRAM_BOT_TOKEN }}' \
              '${{ secrets.ADMIN_EMAIL }}' \
              '${{ secrets.GOOGLE_CLIENT_ID }}' \
              '${{ secrets.GOOGLE_CLIENT_SECRET }}' \
              '${{ secrets.GC_PROM_URL }}' \
              '${{ secrets.GC_PROM_USER }}' \
              '${{ secrets.GC_TOKEN }}' \
              '${{ secrets.GC_LOKI_URL }}' \
              '${{ secrets.GC_LOKI_USER }}' \
              '${{ secrets.GC_IP_SALT }}' \
              > /opt/tesouro-direto/.env
            chmod 600 /opt/tesouro-direto/.env
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # 77.0: sem script_stop: true, um comando que falha nao para a execucao.
          # A ultima linha (docker image prune -f) sempre sucede, entao o healthcheck
          # testa o container ANTIGO que continua respondendo 200, fechando o job VERDE
          # mesmo com deploy quebrado no meio. Achado pela revisao adversarial da 77.0.
          script_stop: true
          script: |
            cd /opt/tesouro-direto
            if [ ! -d .git ]; then
              git clone https://github.com/${{ github.repository }} .
            fi
            # Deploy idempotente: fetch + reset --hard em vez de `git pull`. O pull
            # RECUSA quando ha edicao local num arquivo versionado (ex.: um hotfix
            # aplicado direto na VPS, como o chatid do Grafana na O9), travando o
            # deploy silenciosamente e deixando o working tree desatualizado por
            # commits a fio. reset --hard forca o disco a espelhar origin/main,
            # descartando qualquer alteracao local em arquivo versionado.
            # NAO usar `git clean` aqui: apagaria o .env (untracked) escrito no passo
            # anterior e derrubaria o boot.
            git fetch origin main
            git reset --hard origin/main
            # ANCORA (80.2): /usr/local/bin/container-metrics.sh no host e um arquivo
            # REGULAR, nao symlink -- o `reset --hard` acima so espelha o working tree
            # do clone em /opt/tesouro-direto, nunca alcanca esse caminho fora do repo.
            # Sem este bloco, todo fix commitado em infra/host/container-metrics.sh
            # (como o desta mesma branch, 80.2) fica para sempre versionado e nunca
            # aplicado -- exatamente o estado em que o repo esteve desde 12/08. Quem
            # executa o script e o `td-container-metrics.timer` (systemd, dispara a
            # cada 30s); como ele so invoca o binario a cada disparo, a versao nova
            # entra sozinha no ciclo seguinte, sem `daemon-reload` nem restart. Por
            # isso so o script e copiado aqui -- as unidades .service/.timer mudam
            # raramente e copia-las exigiria daemon-reload + restart do timer a cada
            # deploy (superficie de risco maior) por um ganho que so aparece na
            # primeira instalacao; ficam no passo manual do infra/host/README.md.
            # Posicionado ANTES do bloco do nginx (falhar cedo, mesma logica das
            # outras ANCORAS deste arquivo): nao depende do nginx em nada, entao nao
            # ha motivo para rodar depois do reload e arriscar um deploy pela metade
            # se este passo falhar.
            # `cp` direto sobre o destino NAO e seguro aqui: `cp` trunca e reescreve
            # o inode existente in-place (nao unlink+recria), e o timer dispara a
            # cada 30s -- se o bash estiver lendo o arquivo no instante do `cp`
            # (o script pode levar ate ~25s se `docker ps`/`inspect` travarem), pode
            # ler conteudo truncado e executar um comando corrompido. Achado pela
            # revisao adversarial da 80.2. Copiar para um temporario no MESMO
            # diretorio (mesmo filesystem) e `mv -f` por cima e atomico (`rename(2)`):
            # quem ja abriu o inode velho termina de ler ele inteiro; quem abrir
            # depois pega o novo, sem janela de leitura parcial.
            cp infra/host/container-metrics.sh /usr/local/bin/container-metrics.sh.new
            chmod +x /usr/local/bin/container-metrics.sh.new
            mv -f /usr/local/bin/container-metrics.sh.new /usr/local/bin/container-metrics.sh
            cp infra/nginx/tesouro-direto.conf /etc/nginx/sites-enabled/tesouro-direto
            nginx -t && systemctl reload nginx
            # Cache de build habilitado: o reset --hard acima ja muda os inputs do
            # COPY (codigo-fonte) a cada deploy, e as versoes de pacote sao fixas nos
            # .csproj, entao a invalidacao de cache do Docker e correta por construcao.
            docker compose build
            # ANCORA (77.4, achado da revisao adversarial): SEM --remove-orphans, o
            # `docker compose up -d` deixa de pe qualquer container cujo servico
            # SAIU do arquivo -- exatamente o caso de grafana/loki/promtail/
            # node-exporter, removidos do docker-compose.yml nesta fase. O comando
            # fecha com exit code 0 e so um `level=warning "Found orphan containers"`
            # no stderr; como `script_stop: true` (ver ANCORA acima) so aborta em
            # ERRO, nao em warning, o deploy fecharia VERDE com os 5 containers
            # antigos ainda de pe e nenhum dos ~588 MB que sao o proposito inteiro da
            # 77.4 seria liberado.
            docker compose up -d --remove-orphans
            # CORRECAO do primeiro deploy da 77.4: a versao anterior deste comentario
            # afirmava que `--remove-orphans` tambem recolheria o `prometheus`, que
            # ganhou `profiles: ["load"]` na mesma fase. FALSO, e refutado pelo deploy
            # real: os 4 servicos que SAIRAM do arquivo foram varridos, e o
            # `tesouro-direto-prometheus` continuou de pe. Servico desabilitado por
            # profile nao e orfao -- ele SEGUE definido no projeto, so nao esta ativo,
            # entao o sweep nao o alcanca. Reproduzido em sandbox: dar `profiles:` a um
            # servico com container rodando e depois `up -d --remove-orphans` deixa o
            # container intacto, sem warning nenhum.
            #
            # Sem a linha abaixo isso nao seria um problema so de transicao: todo
            # `run-load.sh --local` rodado na VPS sobe o Prometheus efemero e o deixa
            # para tras (72 MB) depois do teste, e nenhum deploy o recolheria.
            # `rm -sf` com o profile explicito para e remove; e idempotente quando ele
            # nao existe ("No stopped containers", exit 0), o que importa sob
            # `script_stop: true`. O volume `prometheus-data` nao e tocado.
            docker compose --profile load rm -sf prometheus
            # Bind-mount de config nao e recriado por `up -d` quando o arquivo muda
            # (feedback compose_bindmount_no_recreate). O alloy tem a mesma armadilha
            # que prometheus/grafana/promtail tinham: config.alloy vem de bind-mount.
            docker compose up -d --force-recreate --no-deps alloy
            echo "Waiting for app to be healthy..."
            # 74.4a: 60s -> 180s. Este e o mesmo deploy que a 74.3 impoe o
            # limite de ~0,18 vCPU ao `app`; startup de .NET com JIT residual
            # esperando o `db` ficar healthy nao cabe em 60s sob essa quota
            # (a 74.2 mediu ~9s local / ~1min na VPS SEM limite de CPU nenhum
            # -- nao usar esse numero como base, a 74.3 corta a CPU disponivel
            # para menos de um quinto).
            timeout 180 bash -c 'until curl -sf http://localhost:5000/health/ready; do sleep 3; done'
            echo "Deploy complete."
            docker image prune -f
