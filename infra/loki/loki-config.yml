auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 74.2 (docs/PLANO.md, docs/load/footprint.md §8): 30d -> 7d, primeiro
  # degrau da escada de retenção/ingestão. max_query_length reduzido junto
  # (era coerente com 30d, deixaria de ser) — 168h = 7d exatos, cobre toda a
  # janela de retenção sem folga extra que não serve a nada já que não há
  # dado além dela.
  retention_period: 7d
  max_query_length: 168h
  # Ingestão sem teto hoje. Dimensionado contra a taxa REAL observada no
  # footprint (docs/load/footprint.md §3.2/§3.3), não um número redondo:
  # o pico sintético mais alto medido foi ~200 req/s combinados (borda com
  # as duas zonas elevadas a 100r/s só para o teste), nginx sem log_format
  # customizado (combined padrão, ~150-300 B/linha) => pico observado
  # ~0,05-0,06 MB/s. A produção real satura a API bem antes disso (~21-23
  # req/s, docs/load/README.md §7) => ~0,007 MB/s em operação normal.
  # ingestion_rate_mb=2 dá ~35x de margem sobre o pico sintético medido e
  # ~285x sobre a operação normal; ingestion_burst_size_mb=4 absorve
  # rajada momentânea (lote do promtail) sem precisar dobrar o sustentado.
  # per_stream_rate_limit: promtail rotula por status+method
  # (infra/promtail/promtail-config.yml) — sob carga real a maioria das
  # respostas cai no mesmo stream (status=200,method=GET), então o
  # pior caso de UM stream se aproxima do agregado; por isso o limite por
  # stream fica abaixo do agregado (1MB), não igual a ele, para que um
  # stream sozinho não consuma o teto do tenant inteiro.
  ingestion_rate_mb: 2
  ingestion_burst_size_mb: 4
  per_stream_rate_limit: 1MB

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem
