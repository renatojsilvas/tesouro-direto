server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          __path__: /var/log/nginx/*access.log
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>[\d.]+) - (?P<remote_user>\S+) \[(?P<time_local>[^\]]+)\] "(?P<method>[A-Z]+) (?P<request_uri>\S+) (?P<protocol>[^"]+)" (?P<status>\d{3}) (?P<body_bytes_sent>\d+) "(?P<referer>[^"]*)" "(?P<user_agent>[^"]*)"'
      - labels:
          status:
          method:
      - timestamp:
          source: time_local
          format: '02/Jan/2006:15:04:05 -0700'

  # 74.6 - OOM via log de kernel do host. Detecção independente das métricas
  # de container (textfile collector): se Grafana/Prometheus/o timer do host
  # falharem, este pipeline ainda alimenta o Loki e a regra td-oom-kernel-log
  # ainda dispara.
  - job_name: kernel
    static_configs:
      - targets:
          - localhost
        labels:
          job: kernel
          __path__: /var/log/host/kern.log
    pipeline_stages:
      # Descarta tudo que não for linha de OOM antes de enviar ao Loki: o
      # `loki` tem teto de 132 MB e retenção de 7d (tarefa 74.2), mandar o
      # kern.log inteiro estoura o orçamento de ingestão. O seletor usa um
      # filtro de linha negado (`!~`) para casar as linhas QUE NÃO são OOM;
      # `action: drop` descarta essas, então só sobra OOM. Duas formas:
      # "Memory cgroup out of memory" (OOM dentro de um cgroup de container)
      # e "Out of memory: Killed process" (OOM global do host, mais grave
      # ainda e não pode ser filtrado fora).
      - match:
          selector: '{job="kernel"} !~ "Memory cgroup out of memory|Out of memory: Killed process"'
          action: drop
          drop_counter_reason: not_oom
      # SEM stage de `timestamp` de propósito: o kern.log traz timestamp de
      # syslog sem ano (ex.: "Aug 12 03:14:07"). Parseado com um layout tipo
      # "Jan _2 15:04:05" o ano vira 0000, e o Loki rejeita a linha por
      # estar fora da janela de aceitação (too far behind) - a linha de OOM
      # sumiria calada, o oposto do objetivo desta tarefa. Deixamos o Loki
      # usar o horário de ingestão do Promtail.
      #
      # Sem labels por container: o container morto aparece dentro da
      # própria mensagem (oom_memcg=/system.slice/docker-<id>.scope);
      # transformar isso em label seria cardinalidade alta por nada. Só
      # `job: kernel` (herdado do static_configs acima).
