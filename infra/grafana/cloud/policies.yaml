apiVersion: 1
policies:
    - orgId: 1
      receiver: telegram-tesouro
      group_by:
        - alertname
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: telegram-hub
          matchers:
            - service = hub-precos
        - receiver: telegram-operacoes
          matchers:
            - service = operacoes
