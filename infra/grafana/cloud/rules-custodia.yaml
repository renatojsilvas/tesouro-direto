            Decisao:ConciliacaoDeResgatesCicloIntervaloSegundos) reexecutando a MESMA consulta SQL do
            backfill da janela F4→F5 (IRepararResgatesAntigosReadRepository.
            ObterResgatesSemAliqAsync — resgate = tipo='venda' efetivo, sem qualquer ajuste
            revertendo-o, sem a linha aliq:<tradeId>). O DISCRIMINADOR É aliq:, NUNCA ir: —
            um resgate com prejuízo em TODOS os lotes legitimamente não tem ir: nem iof:
            (Σ das bases positivas = 0, e não se grava zero), mas aliq: é gravado SEMPRE,
            porque a_liquidar entra BRUTO; um alerta escrito sobre "sem ir:" dispararia para
            sempre em toda venda com prejuízo. Fora da janela F4→F5 este número deveria ser
            SEMPRE zero: o handler ao vivo (ProcessarTradeRegisteredCommandHandler.
            ProcessarResgateAsync) grava aliq: na MESMA transação da venda. Reaparecer depois
            do backfill fechado é BUG DO HANDLER, não pendência de migração — trate como
            severidade alta. noDataState=OK porque o job publica sempre, mesmo com zero
            pendências (mesma convenção de custodia_fila_profundidade); ausência de dado é
            job parado ou app fora do ar (custodia-app-down cobre isso), não "zero
            pendências". Ao diagnosticar: rode o comando administrativo
            --reparar-resgates-antigos se a fase de migração F4→F5 ainda não fechou; se já
            fechou, busque o LogWarning de RegistrarGuardaResgatesSemAliq e o trade_id via
            IRepararResgatesAntigosReadRepository.ObterResgatesSemAliqAsync para achar o cliente
            e o resgate ofensor.
        labels:
          severity: warning
          service: custodia
        isPaused: false
