apiVersion: 1
groups:
  - orgId: 1
    name: tesouro-alertas
    folder: TesouroDireto
    interval: 1m
    rules:
      # 1 - Dado velho / frescor (E1). Threshold 48h, com gate de dia útil (BRT)
      # para não disparar falso positivo no domingo de manhã (Tesouro não
      # publica preço no fim de semana). day_of_week opera em UTC; "-3*3600"
      # desloca para BRT (UTC-3). 1-5 = seg-sex.
      # Gate adicional de hora (hour(...)>=9): sem ele, toda segunda de
      # madrugada (00:00-06:00 BRT) o gate de dia já está aberto mas a idade
      # ainda reflete a sexta 06:00 (~66h > 48h) -> falso positivo recorrente
      # todo início de semana, até o import das 06:00 resetar. Exigir hora
      # BRT >= 9 mata essa janela e preserva o disparo real: se o import de
      # segunda (06:00) falhar, às 09:00 a idade é ~75h e a regra dispara.
      # Nota: day_of_week()/hour() exigem instant vector, não scalar; por
      # isso "time()-3*3600" é envolvido em vector(...) (sem isso a expr é
      # PromQL inválida e a regra erraria em toda avaliação).
      - uid: td-frescor-dado
        title: "Dado velho (frescor > 48h útil)"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: "(time() - max(import_last_success_timestamp_seconds{job=\"tesouro-direto-api\"})) and on() (day_of_week(vector(time()-3*3600))>=1) and on() (day_of_week(vector(time()-3*3600))<=5) and on() (hour(vector(time()-3*3600))>=9)"
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [172800]
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Preço do Tesouro sem atualização há mais de 48h úteis"
        noDataState: OK
        execErrState: Alerting

      # 2 - App down: target não respondendo aos scrapes do Prometheus.
      # noDataState: Alerting porque o target sumir do Prometheus também é
      # incidente (não deve ficar em silêncio).
      - uid: td-app-down
        title: "App down (target não respondendo)"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: "up{job=\"tesouro-direto-api\"}"
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: eq
                    params: [0]
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "O Prometheus não está conseguindo fazer scrape do target tesouro-direto-api"
        noDataState: Alerting
        execErrState: Alerting

      # 2b - DB/readiness down. Gauge exposto via ForwardToPrometheus() sobre
      # o AddDbContextCheck<AppDbContext> (O5/O9). Série confirmada ao vivo:
      # aspnetcore_healthcheck_status{name="AppDbContext"} (0=Unhealthy,
      # 0.5=Degraded, 1=Healthy). for: 1m porque readiness é sinal rápido.
      - uid: td-db-readiness-down
        title: "DB/readiness down"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: "aspnetcore_healthcheck_status{job=\"tesouro-direto-api\",name=\"AppDbContext\"}"
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: eq
                    params: [0]
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Health check do banco de dados (readiness) está falhando"
        noDataState: Alerting
        execErrState: Alerting

      # 3 - 5xx alto: razão 5xx/total > 5%, com guarda de volume mínimo
      # (> 0.05 rps) para não disparar sobre 1 request isolado.
      # Denominador limpo desde 2026-07-25 (tarefa 29): /health*, /health/live,
      # /health/ready e /metrics saíram da instrumentação server-side (UseHttpMetrics),
      # então esta razão passou a medir só tráfego de negócio. REAVALIAR o threshold
      # (0.05) após ~1 semana de produção com o denominador já limpo.
      - uid: td-http-5xx-alto
        title: "Taxa de erro 5xx alta"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: "(sum(rate(http_request_duration_seconds_count{job=\"tesouro-direto-api\",code=~\"5..\"}[5m])) / sum(rate(http_request_duration_seconds_count{job=\"tesouro-direto-api\"}[5m]))) and on() (sum(rate(http_request_duration_seconds_count{job=\"tesouro-direto-api\"}[5m])) > 0.05)"
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Mais de 5% das respostas HTTP são 5xx nos últimos 5m (com tráfego mínimo)"
        noDataState: OK
        execErrState: Alerting

      # 4 - p95 alto: latência global p95 > 1.5s por 10m. Threshold folgado
      # de propósito (endpoint /simulador chama o BCB e é naturalmente mais
      # lento). Escopo mínimo: p95 global, sem separar por rota.
      - uid: td-http-p95-alto
        title: "Latência p95 alta"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"tesouro-direto-api\"}[5m])) by (le))"
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1.5]
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 de latência HTTP acima de 1.5s nos últimos 10m"
        noDataState: OK
        execErrState: Alerting

      # 5 - Falha de import (E2). Qualquer incremento de outcome="failure"
      # em 6h. Counter só incrementa quando um run falha, então não há
      # falso positivo de fim de semana (nenhum gate necessário).
      - uid: td-import-falha
        title: "Falha de import (E2)"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: "increase(import_runs_total{job=\"tesouro-direto-api\",outcome=\"failure\"}[6h])"
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Import de CSV falhou nas últimas 6h"
        noDataState: OK
        execErrState: Alerting

      # 6 - Simulador degradado (E4). Foco no motivo Projecao.HttpError (BCB
      # indisponível, tarefa 11). Sinal absoluto (>=3 falhas em 15m) em vez
      # de razão, porque o tráfego de simulação é esparso.
      - uid: td-simulador-degradado
        title: "Simulador degradado (BCB indisponível)"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              expr: "increase(simulation_failures_total{job=\"tesouro-direto-api\",reason=\"Projecao.HttpError\"}[15m])"
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gte
                    params: [3]
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "3 ou mais falhas de simulação por indisponibilidade do BCB (Projecao.HttpError) em 15m"
        noDataState: OK
        execErrState: Alerting

      # 6b (complementar, opcional) - razão global de falhas do simulador,
      # para degradações não-BCB. Guarda de volume: exige pelo menos 5
      # simulações no período para a razão não ser ruidosa sobre poucos
      # pontos (mesmo racional que levou a regra 6 a usar contagem absoluta,
      # aqui aplicado como piso mínimo de amostras para o ratio).
      - uid: td-simulador-falha-ratio
        title: "Simulador - taxa de falhas alta (ratio)"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: "(sum(rate(simulation_failures_total{job=\"tesouro-direto-api\"}[10m])) / sum(rate(simulations_total{job=\"tesouro-direto-api\"}[10m]))) and on() (sum(increase(simulations_total{job=\"tesouro-direto-api\"}[10m])) >= 5)"
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.2]
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Taxa de falha de simulação acima de 20% (com volume mínimo de amostras) em 10m"
        noDataState: OK
        execErrState: Alerting

      # 7 - Disco raiz cheio. Uso de disco (/) acima de 85% por 10m. Exclui
      # tmpfs/overlay para não capturar filesystems efêmeros/containers.
      - uid: td-disco-cheio
        title: "Disco raiz acima de 85%"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: "(1 - (node_filesystem_avail_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"})) * 100"
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Uso do disco raiz (/) acima de 85% há mais de 10m"
        noDataState: OK
        execErrState: Alerting

      # 8 - Rate limit anômalo na borda. Volume de respostas 429 do nginx
      # acima do esperado em 5m, sinal de abuso/scraping ou de um cliente
      # com retry sem backoff.
      - uid: td-rate-limit-anomalo
        title: "Rate limit anômalo (429 na borda)"
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: loki
                uid: loki
              expr: "sum(count_over_time({job=\"nginx\", status=\"429\"}[5m]))"
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [20]
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Mais de 20 respostas 429 (rate limit) na borda nginx em 5m"
        noDataState: OK
        execErrState: Alerting

      # 74.6 - Alertas por container + OOM (cAdvisor descartado pela medição
      # da 74.1; fonte é o textfile collector do node-exporter escrevendo
      # `td_container_*` a partir dos cgroups, via systemd timer no host).
      #
      # 9 - Memória de container > 85% do limite (warning). Sobre
      # td_container_memory_unreclaimable_bytes (anon+shmem+kernel), NÃO
      # sobre td_container_memory_working_set_bytes: os tetos da 74.3 foram
      # dimensionados a partir do não-descartável, e working_set inclui
      # active_file (page cache RECLAMÁVEL, o kernel joga fora sob pressão
      # sem matar ninguém). Medido na VPS: alertar sobre working_set
      # acusaria 78%/70% no node-exporter/promtail (risco de OOM por causa
      # de cache) contra 45%/42% real de não-descartável — falso positivo.
      # Guarda "and on(container) (limit > 0)": sem ela, um container sem
      # limite configurado (limit=0) faria a divisão virar +Inf e disparar
      # sempre.
      - uid: td-container-memoria-warning
        title: "Memória de container acima de 85% do limite"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: "(td_container_memory_unreclaimable_bytes / td_container_memory_limit_bytes) * 100 and on(container) (td_container_memory_limit_bytes > 0)"
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memória não-descartável (anon+shmem+kernel) de um container acima de 85% do limite configurado por mais de 5m"
        noDataState: OK
        execErrState: Alerting

      # 10 - Memória de container > 95% do limite (critical). Mesma base
      # (não-descartável, não working_set) e mesma guarda de limit>0 da
      # regra anterior; janela mais curta (2m) porque acima de 95% o OOM
      # killer do cgroup pode agir a qualquer instante.
      - uid: td-container-memoria-critical
        title: "Memória de container acima de 95% do limite"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: "(td_container_memory_unreclaimable_bytes / td_container_memory_limit_bytes) * 100 and on(container) (td_container_memory_limit_bytes > 0)"
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [95]
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Memória não-descartável (anon+shmem+kernel) de um container acima de 95% do limite configurado por mais de 2m — risco iminente de OOM kill"
        noDataState: OK
        execErrState: Alerting

      # 10b - Reclaim sustentado (warning). Complementa 9/10: em vez de uma
      # razão contra um limiar chutado, usa o campo `max` de memory.events
      # (quantas vezes uma alocação bateu no teto e forçou reclaim), cuja
      # linha de base medida na VPS é ZERO nos oito containers com os tetos
      # da 74.3 já corrigidos — então qualquer valor sustentado é pressão
      # real, não ruído de dimensionamento. O limiar (>100 em 15m, não >0)
      # existe para não disparar sobre um evento isolado; os 9131 eventos
      # do incidente do `grafana` mal dimensionado (74.3) dão a ordem de
      # grandeza de um caso verdadeiro — 100 fica bem abaixo disso.
      - uid: td-container-reclaim-sustentado
        title: "Reclaim de memória sustentado em container"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              expr: "increase(td_container_memory_reclaim_events_total[15m])"
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [100]
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Mais de 100 eventos de reclaim de memória (memory.events max) em 15m — linha de base medida é zero, então isto é pressão real"
        noDataState: OK
        execErrState: Alerting

      # 11 - Throttling de CPU sustentado. Razão rate(throttled)/rate(periods)
      # numa janela de 5m, exigida por 10m para não reagir a um pico curto de
      # CPU (o CFS é quota/100ms, vide feedback_cpu_peso_memoria_teto). Guarda
      # "and on(container) (rate(periods) > 0)": sem ela, um container ocioso
      # (periods=0 no numerador e denominador) daria 0/0 = NaN em vez de
      # simplesmente não ter série.
      # SEGUNDA GUARDA (rate(throttled) > 1), MEDIDA, NÃO CHUTADA: a razão
      # sozinha é falso positivo garantido em container ocioso de quota
      # pequena. O `node-exporter` (cpus: 0.05, ou seja 5ms a cada 100ms)
      # fica ocioso quase o tempo todo e, quando acorda para servir um
      # scrape, estoura a quota — medido na VPS em 90s: 8 períodos, 2
      # throttled, 25,0%, acima do limiar de 20% SEM problema nenhum. O que
      # distingue isso de um aperto real não é a razão, é o volume absoluto:
      # o mesmo `node-exporter` throttla a 0,022 períodos/s, enquanto o
      # `app` sob carga na sua quota throttla perto de 10/s. O corte em 1/s
      # fica ~45x acima do ruído medido e uma ordem de grandeza abaixo do
      # caso real.
      - uid: td-container-cpu-throttling
        title: "Throttling de CPU sustentado em container"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              expr: "(sum(rate(td_container_cpu_cfs_throttled_periods_total[5m])) by (container) / sum(rate(td_container_cpu_cfs_periods_total[5m])) by (container)) * 100 and on(container) (sum(rate(td_container_cpu_cfs_periods_total[5m])) by (container) > 0) and on(container) (sum(rate(td_container_cpu_cfs_throttled_periods_total[5m])) by (container) > 1)"
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [20]
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Mais de 20% dos períodos de CPU de um container foram throttled (janela de 5m, com volume absoluto acima de 1 período/s), sustentado por 10m"
        noDataState: OK
        execErrState: Alerting

      # 12 - Container reiniciou. increase() sobre um counter monotônico:
      # um recreate de deploy zera o contador (novo container ID), e
      # increase() já lida nativamente com reset de counter (soma só os
      # incrementos positivos entre amostras) — não conta o "salto para
      # baixo" do reset como aumento, então um deploy normal não dispara
      # falso positivo.
      # LIMIAR ZERO, DE PROPÓSITO: increase() EXTRAPOLA para as bordas da
      # janela, então um único restart não rende exatamente 1,0 e sim algo
      # como 1,2 — um limiar de "> 1" prometeria "reiniciando" e entregaria
      # "reiniciou uma vez", com o número dependendo de onde as amostras
      # caem na janela. "> 0" é o único limiar honesto sobre um counter
      # extrapolado: qualquer valor positivo significa "houve pelo menos um
      # reinício". Nesta stack nada reinicia em operação normal, então um
      # reinício já merece aviso.
      # Este é também o caminho CONFIÁVEL de detecção de OOM pelo lado das
      # métricas: o .RestartCount do docker inspect ATRAVESSA o restart, ao
      # contrário do contador de cgroup da regra 13.
      - uid: td-container-restart
        title: "Container reiniciou"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              expr: "increase(td_container_restarts_total[15m])"
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container reiniciou nos últimos 15m — nada reinicia sozinho nesta stack fora de um deploy"
        noDataState: OK
        execErrState: Alerting

      # 13 - OOM kill por métrica de cgroup. Sinal rápido (for: 1m) dado que
      # é critical. REDUNDÂNCIA BEST-EFFORT, E ISSO NÃO TEM CONSERTO POR ESTA
      # VIA: o contador pode perder o evento INTEIRO. Duas causas somadas,
      # ambas medidas na 74.1: (a) o `oom_kill` do cgroup ZERA quando o
      # container reinicia mantendo o mesmo container ID, porque
      # `restart: unless-stopped` destrói e recria o cgroup por baixo;
      # (b) o scrape é de 30s, então a sequência realista 0 -> OOM (1) ->
      # restart -> 0 pode acontecer inteira ENTRE dois scrapes e o valor 1
      # nunca ser amostrado. Não confie nesta regra sozinha.
      # Os dois caminhos CONFIÁVEIS são: a regra 19 (Loki / log de kernel),
      # independente de qualquer métrica de container, e a regra 12
      # (restart), cujo .RestartCount do docker inspect atravessa o restart.
      - uid: td-container-oom-kill
        title: "OOM kill detectado (métrica de container)"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: "increase(td_container_oom_kill_total[10m])"
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Contador de OOM kill do cgroup incrementou nos últimos 10m"
        noDataState: OK
        execErrState: Alerting

      # 14 - Dead-man's switch do timer do host (textfile collector). SEM
      # esta regra, se o systemd timer que escreve os `.prom` morrer, as 5
      # regras de container acima (9-13) ficam sem série nova e, com
      # noDataState: OK, simplesmente PARAM DE DISPARAR EM SILÊNCIO — o
      # modo de falha que a 74.6 existe para fechar. Por isso esta regra é
      # a ÚNICA das 6 relacionadas a container com noDataState: Alerting:
      # se node_textfile_mtime_seconds sumir de vez (node-exporter down,
      # por exemplo), a ausência total de dado também deve tocar o alerta.
      - uid: td-metricas-container-obsoletas
        title: "Métricas de container obsoletas (timer do host parado)"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: "(time() - node_textfile_mtime_seconds) > 300 or node_textfile_scrape_error > 0"
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "O textfile collector do node-exporter está com dado velho (>5m) ou reportando erro de scrape"
        noDataState: Alerting
        execErrState: Alerting

      # 15 - OOM detectado no log de kernel (via Loki). Modelada em
      # td-rate-limit-anomalo (regra 8). O pipeline do promtail
      # (infra/promtail/promtail-config.yml, job "kernel") já garante que só
      # linha de OOM chega neste job (drop de tudo o mais antes do envio ao
      # Loki, por causa do teto de 132MB/retenção 7d do loki - tarefa 74.2).
      # Esta regra é INDEPENDENTE das métricas de container de propósito: se
      # Grafana/Prometheus/o textfile collector falharem, ela ainda dispara,
      # porque só depende do promtail conseguir ler o kern.log do host e
      # empurrar pro Loki.
      - uid: td-oom-kernel-log
        title: "OOM detectado no log de kernel (via Loki)"
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: loki
                uid: loki
              expr: "sum(count_over_time({job=\"kernel\"}[5m]))"
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Log de kernel do host reportou OOM (memcg de container ou global) nos últimos 5m"
        noDataState: OK
        execErrState: Alerting
