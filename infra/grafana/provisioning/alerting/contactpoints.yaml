apiVersion: 1

# Um único contact point: Telegram. bottoken/chatid são interpolados a
# partir de variáveis de ambiente do processo do Grafana (nunca commitados
# em texto plano). Sintaxe confirmada na doc oficial de provisioning
# (Administration > Provisioning > "Use environment variables"): $VAR ou
# ${VAR} — NÃO existe sintaxe $__env{...} no provisioning do Grafana.
contactPoints:
  - orgId: 1
    name: telegram-tesouro
    receivers:
      - uid: td-telegram-receiver
        type: telegram
        settings:
          bottoken: ${TELEGRAM_BOT_TOKEN}
          chatid: ${TELEGRAM_CHAT_ID}
