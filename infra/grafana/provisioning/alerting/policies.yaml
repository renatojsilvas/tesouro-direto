apiVersion: 1

# Policy raiz roteando todos os alertas para o contact point Telegram.
# Sem sub-rotas por severidade no escopo mínimo (as regras já carregam
# labels.severity para permitir evoluir depois).
policies:
  - orgId: 1
    receiver: telegram-tesouro
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
